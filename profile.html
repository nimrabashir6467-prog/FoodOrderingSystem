<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>QuickBite - Profile</title>


    <!-- Bootstrap -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet">


    <!-- Custom CSS -->

    <link rel="stylesheet" href="style.css">

</head>


<body>


<!-- ================= NAVBAR ================= -->

<nav class="navbar navbar-dark bg-danger">

    <div class="container">

        <a
            href="index.html"
            class="navbar-brand fw-bold">

            🍔 QuickBite

        </a>


        <div>

            <a
                href="dashboard.html"
                class="btn btn-light btn-sm">

                Dashboard

            </a>


            <a
                href="index.html"
                class="btn btn-light btn-sm">

                Home

            </a>

        </div>

    </div>

</nav>



<!-- ================= PROFILE ================= -->

<div class="container mt-5">

    <div
        class="card shadow p-4 mx-auto"
        style="max-width:600px;">


        <h2 class="text-center text-danger mb-4">

            👤 User Profile

        </h2>


        <table class="table table-bordered">


            <tr>

                <th>
                    Email
                </th>

                <td id="userEmail">
                    Loading...
                </td>

            </tr>


            <tr>

                <th>
                    User ID
                </th>

                <td id="userId">
                    Loading...
                </td>

            </tr>


            <tr>

                <th>
                    Account Status
                </th>

                <td class="text-success">
                    Active ✅
                </td>

            </tr>


            <tr>

                <th>
                    Authentication
                </th>

                <td>
                    Firebase Authentication
                </td>

            </tr>


        </table>


        <div class="text-center mt-3">

            <button
                id="logoutBtn"
                class="btn btn-danger">

                Logout

            </button>

        </div>


    </div>

</div>



<!-- ================= FOOTER ================= -->

<footer
    class="bg-dark text-white text-center p-3 mt-5">

    © 2026 QuickBite

</footer>



<!-- ================= FIREBASE ================= -->

<script type="module">

import { initializeApp }

from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";


import {

    getAuth,
    onAuthStateChanged,
    signOut

}

from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";



/* ================= FIREBASE CONFIG ================= */

const firebaseConfig = {

    apiKey: "AIzaSyBVoU3UMmWPji03TS_XU_ZNHCGtY5fJrPQ",

    authDomain: "quickbite-21e58.firebaseapp.com",

    projectId: "quickbite-21e58",

    storageBucket: "quickbite-21e58.firebasestorage.app",

    messagingSenderId: "874037081220",

    appId: "1:874037081220:web:f7812a30f6350075aabed1"

};



/* ================= INITIALIZE ================= */

const app =
    initializeApp(firebaseConfig);


const auth =
    getAuth(app);



/* ================= HTML ELEMENTS ================= */

const userEmail =
    document.getElementById("userEmail");


const userId =
    document.getElementById("userId");


const logoutBtn =
    document.getElementById("logoutBtn");



/* ================= CHECK USER ================= */

onAuthStateChanged(auth, (user) => {

    if (user) {

        userEmail.textContent =
            user.email;


        userId.textContent =
            user.uid;

    }

    else {

        window.location.href =
            "login.html";

    }

});



/* ================= LOGOUT ================= */

logoutBtn.addEventListener(
    "click",
    async () => {

        try {

            await signOut(auth);


            alert(
                "Logout Successful ✅"
            );


            window.location.href =
                "login.html";

        }

        catch (error) {

            console.error(
                "Logout Error:",
                error
            );


            alert(
                "Logout failed. Please try again."
            );

        }

    }
);

</script>


</body>

</html>
