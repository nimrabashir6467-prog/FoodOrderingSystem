<!DOCTYPE html>
<html>
<head>
    <title>QuickBite - My Orders</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<nav class="navbar navbar-dark bg-danger">
    <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">
            🍔 QuickBite
        </a>

        <a href="dashboard.html" class="btn btn-light btn-sm">
            Dashboard
        </a>
    </div>
</nav>


<div class="container mt-5">

<h2 class="text-center text-danger mb-4">
    📦 My Orders
</h2>


<div id="ordersContainer" class="row">

</div>


</div>


<script type="module">

import { initializeApp } 
from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";

import { 
getFirestore,
collection,
getDocs
}
from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";


const firebaseConfig = {

apiKey: "AIzaSyBVoU3UMmWPji03TS_XU_ZNHCGtY5fJrPQ",
authDomain: "quickbite-21e58.firebaseapp.com",
projectId: "quickbite-21e58",
storageBucket: "quickbite-21e58.firebasestorage.app",
messagingSenderId: "874037081220",
appId: "1:874037081220:web:f7812a30f6350075aabed1"

};


const app = initializeApp(firebaseConfig);

const db = getFirestore(app);



const ordersContainer = document.getElementById("ordersContainer");


async function loadOrders(){

const querySnapshot = await getDocs(collection(db,"orders"));


querySnapshot.forEach((doc)=>{


let order = doc.data();


ordersContainer.innerHTML += `

<div class="col-md-4 mb-3">

<div class="card shadow p-3">

<h4>${order.foodName}</h4>

<p>
Quantity: ${order.quantity}
</p>

<p>
Price: Rs. ${order.price || order.totalPrice}
</p>

<p>
Status: ${order.status}
</p>

</div>

</div>

`;

});


}


loadOrders();


</script>


</body>
</html>
