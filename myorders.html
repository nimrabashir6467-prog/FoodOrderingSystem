<!DOCTYPE html>

<html lang="en">

<head>


<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>QuickBite - My Orders</title>


<!-- Bootstrap -->

<link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
    rel="stylesheet">


<!-- Custom CSS -->

<link rel="stylesheet" href="style.css">


</head>

<body>

<!-- ================= NAVBAR ================= -->

<nav class="navbar navbar-dark bg-danger">


<div class="container">

    <a
        class="navbar-brand fw-bold"
        href="index.html">

        🍔 QuickBite

    </a>


    <a
        href="dashboard.html"
        class="btn btn-light btn-sm">

        Dashboard

    </a>

</div>


</nav>

<!-- ================= MY ORDERS ================= -->

<div class="container mt-5">


<h2 class="text-center text-danger mb-4">

    📦 My Orders

</h2>


<div
    id="ordersContainer"
    class="row">

    <div class="col-12 text-center">

        <p>
            Loading orders...
        </p>

    </div>

</div>


</div>

<!-- ================= FIREBASE ================= -->

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";


import {

    getAuth,
    onAuthStateChanged

}
from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";


import {

    getFirestore,
    collection,
    getDocs

}
from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";



/* ================= FIREBASE CONFIG ================= */

const firebaseConfig = {

    apiKey: "AIzaSyBVoU3UMmWPji03TS_XU_ZNHCGtY5fJrPQ",

    authDomain: "quickbite-21e58.firebaseapp.com",

    projectId: "quickbite-21e58",

    storageBucket: "quickbite-21e58.firebasestorage.app",

    messagingSenderId: "874037081220",

    appId: "1:874037081220:web:f7812a30f6350075aabed1"

};



/* ================= INITIALIZE FIREBASE ================= */

const app =
    initializeApp(firebaseConfig);


const auth =
    getAuth(app);


const db =
    getFirestore(app);



/* ================= HTML ELEMENT ================= */

const ordersContainer =
    document.getElementById("ordersContainer");



/* ================= LOAD USER ORDERS ================= */

const loadOrders = async (user) => {

    try {

        ordersContainer.innerHTML = "";


        const querySnapshot =
            await getDocs(
                collection(db, "orders")
            );


        let orderFound = false;


        querySnapshot.forEach((doc) => {

            const order =
                doc.data();


            /*
             * Only show orders belonging
             * to the currently logged-in user.
             */

            if (order.userId === user.uid) {

                orderFound = true;


                ordersContainer.innerHTML += `

                    <div class="col-md-4 mb-4">

                        <div class="card shadow p-3 h-100">

                            <h4>
                                ${order.foodName}
                            </h4>


                            <p>
                                Quantity: ${order.quantity}
                            </p>


                            <p>
                                Price: Rs. ${order.price || order.totalPrice}
                            </p>


                            <p>
                                Status: ${order.status}
                            </p>

                        </div>

                    </div>

                `;

            }

        });


        /* ================= NO ORDERS ================= */

        if (!orderFound) {

            ordersContainer.innerHTML = `

                <div class="col-12 text-center">

                    <p class="text-muted">

                        You have no orders yet.

                    </p>

                </div>

            `;

        }


    }

    catch (error) {

        console.error(
            "Orders Error:",
            error
        );


        ordersContainer.innerHTML = `

            <div class="col-12 text-center">

                <p class="text-danger">

                    Unable to load your orders.

                </p>

                <p>

                    ${error.message}

                </p>

            </div>

        `;

    }

};



/* ================= CHECK LOGIN ================= */

onAuthStateChanged(auth, (user) => {

    if (!user) {

        window.location.href =
            "login.html";

        return;

    }


    console.log(
        "Current User UID:",
        user.uid
    );


    loadOrders(user);

});

</script>

</body>

</html>
