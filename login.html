<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickBite - Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-danger">
    <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">🍔 QuickBite</a>

        <div>
            <a href="index.html" class="btn btn-light btn-sm">Home</a>
            <a href="register.html" class="btn btn-light btn-sm">Register</a>
        </div>
    </div>
</nav>


<div class="container mt-5" style="max-width:500px;">

    <div class="card shadow p-4">

        <h2 class="text-center text-danger mb-4">Login</h2>

        <form id="loginForm">

            <div class="mb-3">
                <label>Email</label>
                <input type="email" id="email" class="form-control" placeholder="Enter your email" required>
            </div>

            <div class="mb-3">
                <label>Password</label>
                <input type="password" id="password" class="form-control" placeholder="Enter your password" required>
            </div>

            <button type="submit" class="btn btn-danger w-100">
                Login
            </button>

        </form>

        <p id="message" class="text-center mt-3"></p>

        <p class="text-center mt-3">
            Don't have an account?
            <a href="register.html">Register</a>
        </p>

    </div>

</div>


<footer class="bg-dark text-white text-center p-3 mt-5">
    © 2026 QuickBite
</footer>


<script type="module">

import {
    getAuth,
    signInWithEmailAndPassword
} from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";


const firebaseConfig = {
  apiKey: "AIzaSyBVoU3UMmWPji03TS_XU_ZNHCGtY5fJrPQ",
  authDomain: "quickbite-21e58.firebaseapp.com",
  projectId: "quickbite-21e58",
  storageBucket: "quickbite-21e58.firebasestorage.app",
  messagingSenderId: "874037081220",
  appId: "1:874037081220:web:f7812a30f6350075aabed1"
};


const app = initializeApp(firebaseConfig);
const auth = getAuth(app);


document.getElementById("loginForm").addEventListener("submit", async (e)=>{

    e.preventDefault();

    let email = document.getElementById("email").value;
    let password = document.getElementById("password").value;


    try{

        await signInWithEmailAndPassword(
            auth,
            email,
            password
        );


        document.getElementById("message").innerHTML =
        "Login Successful ✅";

        setTimeout(() => {
            window.location.href = "dashboard.html";
        }, 1000);


    }
    catch(error){

        document.getElementById("message").innerHTML =
        error.message;

    }

});

</script>


</body>
</html>
