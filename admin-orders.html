<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>QuickBite - Manage Orders</title>


    <!-- Bootstrap -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet">


    <!-- Custom CSS -->

    <link rel="stylesheet" href="style.css">

</head>


<body>


<!-- ================= NAVBAR ================= -->

<nav class="navbar navbar-dark bg-danger">

    <div class="container">

        <a
            class="navbar-brand fw-bold"
            href="dashboard.html">

            🍔 QuickBite

        </a>


        <a
            href="dashboard.html"
            class="btn btn-light btn-sm">

            Dashboard

        </a>

    </div>

</nav>



<!-- ================= MANAGE ORDERS ================= -->

<div class="container mt-5">


    <h2 class="text-center text-danger mb-4">

        📦 Manage Orders

    </h2>


    <div
        id="ordersContainer"
        class="row">

        <div class="col-12 text-center">

            <p>
                Loading orders...
            </p>

        </div>

    </div>


</div>



<!-- ================= FIREBASE ================= -->

<script type="module">

import { db } from "./firebase.js";


import {

    collection,
    getDocs,
    updateDoc,
    deleteDoc,
    doc

}

from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";



const ordersContainer =
    document.getElementById("ordersContainer");



// ================= LOAD ORDERS =================

async function loadOrders() {

    try {

        ordersContainer.innerHTML = "";


        const snapshot =
            await getDocs(
                collection(db, "orders")
            );


        if (snapshot.empty) {

            ordersContainer.innerHTML = `

                <div class="col-12 text-center">

                    <p class="text-muted">

                        No orders found.

                    </p>

                </div>

            `;

            return;

        }


        snapshot.forEach((orderDoc) => {

            const order =
                orderDoc.data();


            const id =
                orderDoc.id;


            ordersContainer.innerHTML += `

                <div class="col-md-4 mb-4">

                    <div class="card shadow p-3 h-100">


                        <h4>
                            ${order.foodName}
                        </h4>


                        <p>
                            Customer ID:
                            ${order.userId || "Not available"}
                        </p>


                        <p>
                            Quantity:
                            ${order.quantity}
                        </p>


                        <p>
                            Price:
                            Rs. ${order.price || order.totalPrice}
                        </p>


                        <p>
                            Status:
                            <strong>
                                ${order.status}
                            </strong>
                        </p>


                        <button
                            class="btn btn-success mb-2"
                            onclick="updateStatus('${id}')">

                            Complete Order

                        </button>


                        <button
                            class="btn btn-danger"
                            onclick="deleteOrder('${id}')">

                            Delete Order

                        </button>


                    </div>

                </div>

            `;

        });

    }

    catch (error) {

        console.error(
            "Orders Error:",
            error
        );


        ordersContainer.innerHTML = `

            <div class="col-12 text-center">

                <p class="text-danger">

                    Unable to load orders.

                </p>

                <p>

                    ${error.message}

                </p>

            </div>

        `;

    }

}



// ================= UPDATE STATUS =================

window.updateStatus = async function(id) {

    try {

        await updateDoc(
            doc(db, "orders", id),
            {
                status: "Completed"
            }
        );


        alert(
            "Order Completed ✅"
        );


        loadOrders();

    }

    catch (error) {

        console.error(
            "Update Error:",
            error
        );


        alert(
            "Unable to update order."
        );

    }

};



// ================= DELETE ORDER =================

window.deleteOrder = async function(id) {

    try {

        await deleteDoc(
            doc(db, "orders", id)
        );


        alert(
            "Order Deleted 🗑️"
        );


        loadOrders();

    }

    catch (error) {

        console.error(
            "Delete Error:",
            error
        );


        alert(
            "Unable to delete order."
        );

    }

};



// ================= START =================

loadOrders();

</script>


</body>

</html>
